# ============================================================
#  Data Lake — Infrastructure complète
#
#  Stockage   : MinIO (zones RAW + STAGING, compatible S3)
#  Recherche  : Elasticsearch (zone CURATED)
#  Orchestration : Apache Airflow (Postgres = base de métadonnées)
#
#  Démarrage : docker compose up -d
#  Airflow   : http://localhost:8080  (admin / admin)
#  MinIO     : http://localhost:9001  (minioadmin / minioadmin123)
# ============================================================

# Bloc réutilisable partagé par tous les services Airflow (ancre YAML).
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  image: datalake/airflow:2.10.5
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__WEBSERVER__SECRET_KEY: datalake-secret-key
    # Rend notre package `src` importable depuis les DAGs
    PYTHONPATH: /opt/airflow
    # Cache HuggingFace persistant : le modèle RoBERTa (~500 Mo) n'est
    # téléchargé qu'une seule fois, pas à chaque exécution de tâche.
    HF_HOME: /opt/airflow/hf_cache

    # --- Config de notre data lake ---
    # ATTENTION : depuis un conteneur, on joint les autres services par leur
    # NOM DE SERVICE (minio, elasticsearch), pas par localhost.
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    RAW_BUCKET: ${RAW_BUCKET:-raw}
    STAGING_BUCKET: ${STAGING_BUCKET:-staging}
    ES_HOST: http://elasticsearch:9200
    ES_INDEX: ${ES_INDEX:-curated_sentiment}
    SENTIMENT_ENGINE: ${SENTIMENT_ENGINE:-transformer}
    HN_STORY_TYPE: ${HN_STORY_TYPE:-topstories}
    HN_MAX_ITEMS: ${HN_MAX_ITEMS:-50}
    HF_DATASET: ${HF_DATASET:-cardiffnlp/tweet_eval}
    HF_DATASET_CONFIG: ${HF_DATASET_CONFIG:-sentiment}
    HF_SAMPLE_SIZE: ${HF_SAMPLE_SIZE:-500}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./src:/opt/airflow/src          # notre code, monté en direct
    - hf_cache:/opt/airflow/hf_cache
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ---------- Zones RAW + STAGING : stockage objet S3 ----------
  minio:
    image: minio/minio:latest
    container_name: dl_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------- Création automatique des buckets ----------
  createbuckets:
    image: minio/mc:latest
    container_name: dl_createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123};
      mc mb --ignore-existing local/${RAW_BUCKET:-raw};
      mc mb --ignore-existing local/${STAGING_BUCKET:-staging};
      echo 'Buckets raw + staging prêts';
      exit 0;
      "

  # ---------- Zone CURATED : Elasticsearch ----------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.1
    container_name: dl_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false          # pas d'auth : projet local uniquement
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"       # limite la RAM
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ---------- Base de métadonnées d'Airflow ----------
  # Airflow y stocke l'état des DAGs, des tâches, les XCom, etc.
  postgres:
    image: postgres:13
    container_name: dl_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------- Initialisation d'Airflow (migrations + compte admin) ----------
  # Service éphémère : il s'exécute une fois puis s'arrête.
  airflow-init:
    <<: *airflow-common
    container_name: dl_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com || true
    restart: "no"

  # ---------- Airflow : interface web ----------
  airflow-webserver:
    <<: *airflow-common
    container_name: dl_airflow_web
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ---------- Airflow : ordonnanceur (exécute réellement les tâches) ----------
  airflow-scheduler:
    <<: *airflow-common
    container_name: dl_airflow_scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------- API Gateway (FastAPI) ----------
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: datalake/api:1.0.0
    container_name: dl_api
    ports:
      - "8000:8000"
    environment:
      # Adresses inter-conteneurs : par NOM DE SERVICE, pas localhost.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      RAW_BUCKET: ${RAW_BUCKET:-raw}
      STAGING_BUCKET: ${STAGING_BUCKET:-staging}
      ES_HOST: http://elasticsearch:9200
      ES_INDEX: ${ES_INDEX:-curated_sentiment}
      SENTIMENT_ENGINE: ${SENTIMENT_ENGINE:-transformer}
      HF_HOME: /app/hf_cache
    volumes:
      - ./src:/app/src          # code monté en direct (rechargement facile)
      - hf_cache:/app/hf_cache  # modèle partagé avec Airflow (déjà téléchargé)
    depends_on:
      minio:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  minio_data:
  es_data:
  postgres_data:
  hf_cache:
