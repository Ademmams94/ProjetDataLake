# ============================================================
#  Infrastructure du Data Lake (Phase 1)
#  - MinIO         : stockage objet S3-compatible (zones RAW + STAGING)
#  - createbuckets : crée automatiquement les buckets au démarrage
#  - elasticsearch : moteur de la zone CURATED
#
#  Airflow et l'API FastAPI seront ajoutés aux phases 5 et 6.
#  Démarrage : docker compose up -d
# ============================================================

services:
  # ---------- Zone RAW + STAGING : stockage objet S3 ----------
  minio:
    image: minio/minio:latest
    container_name: dl_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web (http://localhost:9001)
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------- Création automatique des buckets ----------
  createbuckets:
    image: minio/mc:latest
    container_name: dl_createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123};
      mc mb --ignore-existing local/${RAW_BUCKET:-raw};
      mc mb --ignore-existing local/${STAGING_BUCKET:-staging};
      echo 'Buckets raw + staging prêts';
      exit 0;
      "

  # ---------- Zone CURATED : Elasticsearch ----------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.1
    container_name: dl_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false          # pas d'auth : projet local uniquement
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"       # limite la RAM (machine locale)
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  minio_data:
  es_data:
